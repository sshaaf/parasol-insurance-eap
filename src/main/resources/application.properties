# Datasource (in-memory H2 for local/dev)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:parasol;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

# Hibernate
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=import.sql

# HTTP — static UI served from META-INF/resources at /
# (quarkus.http.static-dir.* needs Quarkus 3.34+; not on 3.15.5)
quarkus.http.port=8080

# Note: email-intake channel is wired in-process via @Channel Emitter + @Incoming
# (no external broker/connector needed for this demo)
