# Datasource (in-memory H2 for local/dev — default profile)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:parasol;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

# Hibernate
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=import.sql

# HTTP — static UI served from META-INF/resources at /
# (quarkus.http.static-dir.* needs Quarkus 3.34+; not on 3.15.5)
quarkus.http.port=8080

# Note: email-intake channel is wired in-process via @Channel Emitter + @Incoming
# (no external broker/connector needed for this demo)

# ---------------------------------------------------------------------------
# %prod — OpenShift / packaged JAR (active when not running quarkus:dev)
# Wire POSTGRESQL_* from the OpenShift PostgreSQL Secret / Service.
# ---------------------------------------------------------------------------
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${POSTGRESQL_USER:parasol}
%prod.quarkus.datasource.password=${POSTGRESQL_PASSWORD:parasol}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRESQL_HOST:parasol-db}:${POSTGRESQL_PORT:5432}/${POSTGRESQL_DATABASE:parasol}
%prod.quarkus.hibernate-orm.database.generation=drop-and-create
%prod.quarkus.hibernate-orm.sql-load-script=import.sql
%prod.quarkus.http.host=0.0.0.0
%prod.quarkus.http.port=8080
