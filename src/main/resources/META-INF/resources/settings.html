<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Parasol Insurance</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="page-content">
        <h1 class="page-title">Settings</h1>

        <div class="card">
            <div class="card-header">Preferences</div>
            <div class="card-body">
                <table class="claims-table">
                    <tbody>
                        <tr><td>Display name</td><td>Alex Garcia</td></tr>
                        <tr><td>Email</td><td>alex.garcia@parasol.demo</td></tr>
                        <tr><td>Default landing page</td><td>Dashboard</td></tr>
                        <tr><td>Inbox poll interval</td><td>5 seconds</td></tr>
                        <tr><td>Theme</td><td>Light</td></tr>
                        <tr><td>Notifications</td><td><span class="status-badge processed">Enabled</span></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/layout.js"></script>
    <script>initLayout('settings');</script>
</body>
</html>
